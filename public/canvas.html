<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GDC Project Compliance Canvas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpolygon points='32,2 62,22 62,42 32,62 2,42 2,22' fill='%23FF4D00'/%3E%3C/svg%3E">
<style>
/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0}

/* ── Screen shell ── */
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4ff;color:#1e293b;min-height:100vh;}
.screen-bar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(30,80,160,0.06);}
.screen-bar a{font-size:0.82rem;color:#0176d3;text-decoration:none;white-space:nowrap;}
.screen-bar a:hover{text-decoration:underline;}
.screen-bar h1{font-size:1rem;font-weight:700;color:#0a1f44;flex:1;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 18px;border-radius:22px;font-size:0.82rem;font-weight:700;cursor:pointer;border:none;transition:background 0.15s;white-space:nowrap;}
.btn-primary{background:#0176d3;color:#fff;} .btn-primary:hover{background:#0156a3;} .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-print{background:#6366f1;color:#fff;} .btn-print:hover{background:#4f46e5;}
#status{font-size:0.8rem;color:#64748b;font-style:italic;}
.screen-content{padding:28px 24px;}

/* ── Canvas document ── */
#canvas-doc{
  max-width:900px;margin:0 auto;background:#fff;
  border-radius:18px;box-shadow:0 4px 32px rgba(30,80,160,0.10);
  padding:48px 52px;
}

/* ── Typography ── */
.doc-title{font-size:2rem;font-weight:800;color:#0a1f44;line-height:1.2;margin-bottom:4px;}
.doc-date{font-size:0.9rem;color:#64748b;margin-bottom:6px;font-style:italic;}
.doc-divider{border:none;border-top:2px solid #e2e8f0;margin:22px 0;}

/* ── Section headings ── */
.section{margin-bottom:32px;}
.section-heading{font-size:1.18rem;font-weight:800;color:#0a1f44;display:flex;align-items:center;gap:10px;margin-bottom:14px;}

/* ── Callout box ── */
.callout{border-radius:10px;padding:13px 18px;margin-bottom:16px;font-size:0.88rem;line-height:1.55;}
.callout-green{background:#f0fdf4;border-left:4px solid #16a34a;color:#166534;}
.callout-yellow{background:#fefce8;border-left:4px solid #d97706;color:#92400e;}
.callout-red{background:#fef2f2;border-left:4px solid #dc2626;color:#991b1b;}
.callout-blue{background:#eff6ff;border-left:4px solid #0176d3;color:#1e40af;}

/* ── Bullet lists ── */
.bullet-list{padding-left:0;list-style:none;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:0;}
.bullet-list li{display:inline-flex;align-items:center;gap:7px;background:#f8faff;border:1px solid #e2e8f0;border-radius:20px;padding:5px 14px;font-size:0.88rem;font-weight:600;color:#334155;}
.bullet-list li .num{font-size:1.1rem;font-weight:800;color:#0a1f44;}
.bullet-list li .lbl{color:#64748b;font-weight:400;}

/* ── Summary table (4 cols) ── */
.summary-table{width:100%;border-collapse:collapse;font-size:0.85rem;margin-top:4px;}
.summary-table th{background:#f1f5f9;font-weight:700;color:#0a1f44;padding:9px 13px;border:1px solid #e2e8f0;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
.summary-table td{padding:9px 13px;border:1px solid #e2e8f0;vertical-align:top;}
.summary-table tr:nth-child(even) td{background:#f8faff;}
.summary-table .col-num{text-align:center;width:36px;color:#94a3b8;font-weight:600;}
.summary-table .col-count{text-align:center;width:64px;font-weight:800;font-size:1rem;}
.summary-table .col-count.red{color:#dc2626;}
.summary-table .col-count.green{color:#16a34a;}
.summary-table .col-count.amber{color:#d97706;}
.summary-table .col-comment{color:#64748b;font-size:0.82rem;font-style:italic;}

/* ── Detail project tables ── */
.detail-table{width:100%;border-collapse:collapse;font-size:0.82rem;margin-top:10px;}
.detail-table th{background:#1e293b;color:#e2e8f0;padding:8px 11px;text-align:left;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap;}
.detail-table td{padding:8px 11px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
.detail-table tr:hover td{background:#f8faff;}
.detail-table .status-red{color:#dc2626;font-weight:700;}
.detail-table .status-yellow{color:#d97706;font-weight:700;}
.detail-table .status-green{color:#16a34a;font-weight:700;}
.detail-table .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.72rem;font-weight:600;}
.tag-red{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;}
.tag-amber{background:#fefce8;color:#d97706;border:1px solid #fde68a;}
.tag-green{background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;}
.tag-blue{background:#eff6ff;color:#0176d3;border:1px solid #bfdbfe;}

/* ── Practice / DM tables ── */
.breakdown-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
.breakdown-table th{background:#f1f5f9;font-weight:700;color:#0a1f44;padding:9px 13px;border:1px solid #e2e8f0;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.5px;}
.breakdown-table td{padding:9px 13px;border:1px solid #e2e8f0;}
.breakdown-table tr:nth-child(even) td{background:#f8faff;}
.bar-cell{display:flex;align-items:center;gap:10px;}
.bar-track{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:#0176d3;}
.bar-pct{font-size:0.78rem;color:#64748b;font-weight:600;min-width:36px;text-align:right;}

/* ── Footer ── */
.doc-footer{margin-top:32px;padding-top:18px;border-top:1px solid #e2e8f0;font-size:0.78rem;color:#94a3b8;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

/* ── Print styles ── */
@media print{
  .screen-bar{display:none;}
  .screen-content{padding:0;}
  body{background:#fff;}
  #canvas-doc{box-shadow:none;border-radius:0;padding:28px 36px;max-width:100%;}
  .detail-table th{background:#334155 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .summary-table th,.breakdown-table th{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .section{page-break-inside:avoid;}
}
</style>
</head>
<body>

<!-- Screen toolbar (hidden on print) -->
<div class="screen-bar">
  <a href="/">&#8592; Dashboard</a>
  <h1>&#128203; GDC Compliance Canvas</h1>
  <button class="btn btn-primary" id="gen-btn" onclick="generate()">&#9889; Generate from Live Data</button>
  <button class="btn btn-print" id="print-btn" onclick="window.print()" style="display:none">&#128438; Save as PDF / Print</button>
  <span id="status">Click Generate to load live Salesforce data.</span>
</div>

<div class="screen-content">
  <div id="canvas-doc" style="display:none"></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   Helpers — exact copies from index.html
   ═══════════════════════════════════════════════════════════ */
var TODAY = new Date(); TODAY.setHours(12,0,0,0);

function parseDate(str){
  if(!str) return null;
  var p=str.split('-'); if(p.length!==3) return null;
  return new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12,0,0));
}
function daysDiff(d1,d2){ return Math.round((d1.getTime()-d2.getTime())/86400000); }
function fmtDate(str){ if(!str) return '—'; var d=parseDate(str); if(!d) return '—'; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtOrdinal(n){ var s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function fmtLongDate(dt){
  var M=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var D=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return D[dt.getDay()]+', '+fmtOrdinal(dt.getDate())+' '+M[dt.getMonth()]+' '+dt.getFullYear();
}

function normalise(records){
  records.forEach(function(p){
    var sr=p.Status_Reports__r&&p.Status_Reports__r.records;
    p._lastStatusReport=(sr&&sr.length)?sr[0].PSA_PM_Status_Report_Week__c:null;
    var cs=p.Customer_Surveys__r&&p.Customer_Surveys__r.records;
    p._lastCSAT=(cs&&cs.length)?cs[0].psa_pm_Survey_Sent_Date__c:null;
    var ae=p.Adoption_Events__r&&p.Adoption_Events__r.records;
    p._hasAE=!!(ae&&ae.length);
    p._dm=(p.pse__Project_Manager__r&&p.pse__Project_Manager__r.Name)||'—';
    p._acct=(p.pse__Account__r&&p.pse__Account__r.Name)||'—';
    p._prac=(p.pse__Practice__r&&p.pse__Practice__r.Name)||'—';
  });
  return records;
}
function isInternal(p){
  var bad=['completed','cancelled','canceled','on hold','closed','delivery complete'];
  if(bad.indexOf((p.pse__Stage__c||'').toLowerCase())!==-1) return true;
  if((p._prac||'').toLowerCase()==='internal') return true;
  var c=(p.psa_pm_Project_Category__c||'').toLowerCase();
  return c==='productive non - billable'||c==='internal';
}
function hasRecentTimecard(p){
  var d=parseDate(p.psa_tm_Last_Time_Entry_Date__c);
  return d&&daysDiff(TODAY,d)<=90;
}
function statusClass(s){
  if(s==='Red') return 'status-red';
  if(s==='Yellow') return 'status-yellow';
  if(s==='Green') return 'status-green';
  return '';
}
function statusTag(s){
  if(!s) return tag('—','');
  if(s==='Red') return tag(s,'tag-red');
  if(s==='Yellow') return tag(s,'tag-amber');
  if(s==='Green') return tag(s,'tag-green');
  return tag(s,'tag-blue');
}
function tag(txt,cls){ return '<span class="tag '+cls+'">'+esc(txt)+'</span>'; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ═══════════════════════════════════════════════════════════
   Build detail project table HTML
   ═══════════════════════════════════════════════════════════ */
function detailTable(projects, cols){
  if(!projects.length) return '<p style="color:#94a3b8;font-size:0.85rem;padding:10px 0;">No projects in this category.</p>';
  var colDefs={
    project:  {h:'Project Name',     fn:function(p){ return '<strong>'+esc(p.Name)+'</strong>'; }},
    account:  {h:'Account',          fn:function(p){ return esc(p._acct); }},
    practice: {h:'Practice',         fn:function(p){ return esc(p._prac); }},
    dm:       {h:'Delivery Manager', fn:function(p){ return esc(p._dm); }},
    status:   {h:'Project Status',   fn:function(p){ return statusTag(p.pse__Project_Status__c); }},
    enddate:  {h:'End Date',         fn:function(p){ var d=fmtDate(p.pse__End_Date__c); var raw=parseDate(p.pse__End_Date__c); var cls=raw&&raw<TODAY?'tag tag-red':''; return cls?'<span class="'+cls+'">'+esc(d)+'</span>':esc(d); }},
    margin:   {h:'Margin %',         fn:function(p){ var m=p.PSA_PM_Margin_Percent__c; if(m==null) return '—'; return '<span class="tag '+(m<50?'tag-red':'tag-green')+'">'+m.toFixed(1)+'%</span>'; }},
    timecard: {h:'Last Timecard',    fn:function(p){ var d=fmtDate(p.psa_tm_Last_Time_Entry_Date__c); var raw=parseDate(p.psa_tm_Last_Time_Entry_Date__c); var late=!raw||daysDiff(TODAY,raw)>30; return late?'<span class="tag tag-red">'+esc(d)+'</span>':esc(d); }},
    hours:    {h:'Planned Hrs',      fn:function(p){ return esc(p.pse__Planned_Hours__c!=null?p.pse__Planned_Hours__c:'—'); }},
    remaining:{h:'Hrs Remaining',    fn:function(p){ var v=p.PSA_PM_Total_Billable_Hours_Remaining__c; if(v==null) return '—'; return '<span class="tag '+(v<0?'tag-red':'tag-green')+'">'+v+'</span>'; }},
    csat:     {h:'Last CSAT',        fn:function(p){ return esc(fmtDate(p._lastCSAT)); }},
    report:   {h:'Last Status Rpt',  fn:function(p){ return esc(fmtDate(p._lastStatusReport)); }},
    atrisk:   {h:'At Risk',          fn:function(p){ return p.psa_pm_At_Risk__c?'<span class="tag tag-red">Yes</span>':'<span class="tag tag-green">No</span>'; }},
    ae:       {h:'Adoption Events',  fn:function(p){ return p._hasAE?'<span class="tag tag-green">Yes</span>':'<span class="tag tag-red">No</span>'; }},
  };
  var html='<table class="detail-table"><thead><tr>';
  cols.forEach(function(c){ html+='<th>'+colDefs[c].h+'</th>'; });
  html+='</tr></thead><tbody>';
  projects.forEach(function(p){
    html+='<tr>';
    cols.forEach(function(c){ html+='<td>'+colDefs[c].fn(p)+'</td>'; });
    html+='</tr>';
  });
  html+='</tbody></table>';
  return html;
}

/* ═══════════════════════════════════════════════════════════
   Build full canvas HTML
   ═══════════════════════════════════════════════════════════ */
function buildCanvas(records){
  var active=records.filter(function(p){ return !isInternal(p)&&hasRecentTimecard(p); });
  var N=active.length;
  var oct31=new Date(Date.UTC(2026,9,31,12,0,0));

  /* ── filtered project subsets ── */
  var pastEnd       = active.filter(function(p){ var d=parseDate(p.pse__End_Date__c); return d&&d<TODAY; });
  var endingOct     = active.filter(function(p){ var d=parseDate(p.pse__End_Date__c); return d&&d>=TODAY&&d<=oct31; });
  var noStatus      = active.filter(function(p){ return !p.pse__Project_Status__c; });
  var missingRpt    = active.filter(function(p){ if(!p._lastStatusReport) return true; var d=parseDate(p._lastStatusReport); return d&&daysDiff(TODAY,d)>14; });
  var redStatus     = active.filter(function(p){ return p.pse__Project_Status__c==='Red'; });
  var lowMargin     = active.filter(function(p){ return p.PSA_PM_Margin_Percent__c!=null&&p.PSA_PM_Margin_Percent__c<50; });
  var overBudget    = active.filter(function(p){ return p.PSA_PM_Total_Billable_Hours_Remaining__c!=null&&p.PSA_PM_Total_Billable_Hours_Remaining__c<0; });
  var zeroHours     = active.filter(function(p){ return !p.pse__Planned_Hours__c||p.pse__Planned_Hours__c===0; });
  var timecardLate  = active.filter(function(p){ if(!p.psa_tm_Last_Time_Entry_Date__c) return true; var d=parseDate(p.psa_tm_Last_Time_Entry_Date__c); return d&&daysDiff(TODAY,d)>30; });
  var missingCSAT   = active.filter(function(p){ if(!p._lastCSAT) return true; var d=parseDate(p._lastCSAT); return !d||daysDiff(TODAY,d)>90; });
  var missingAE     = active.filter(function(p){ return !p._hasAE&&!p.PSA_Adoption_Event_Not_Required_Reason__c; });
  var atRisk        = active.filter(function(p){ return p.psa_pm_At_Risk__c; });

  /* ── practice & DM breakdown ── */
  var pracMap={}, dmMap={};
  active.forEach(function(p){
    pracMap[p._prac]=(pracMap[p._prac]||0)+1;
    dmMap[p._dm]=(dmMap[p._dm]||0)+1;
  });
  var pracList=Object.keys(pracMap).sort(function(a,b){ return pracMap[b]-pracMap[a]; });
  var dmList  =Object.keys(dmMap).sort(function(a,b){ return dmMap[b]-dmMap[a]; });

  /* ── helpers ── */
  function countClass(n,bad){ return n===0?'green':(n>=(bad||5)?'red':'amber'); }
  function pill(items){
    return '<ul class="bullet-list">'+items.map(function(i){ return '<li><span class="num">'+i[0]+'</span><span class="lbl">'+esc(i[1])+'</span></li>'; }).join('')+'</ul>';
  }
  function sumRow(num,obs,count,cls,comment){
    return '<tr><td class="col-num">'+num+'</td><td>'+esc(obs)+'</td><td class="col-count '+cls+'">'+count+'</td><td class="col-comment">'+esc(comment)+'</td></tr>';
  }
  function breakdownTable(list,countMap){
    var h='<table class="breakdown-table"><thead><tr><th>Name</th><th>Projects</th><th style="min-width:160px">% of Portfolio</th></tr></thead><tbody>';
    list.forEach(function(k){
      var cnt=countMap[k], pct=N?Math.round((cnt/N)*100):0;
      h+='<tr><td>'+esc(k)+'</td><td style="text-align:center;font-weight:700">'+cnt+'</td>';
      h+='<td><div class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div><span class="bar-pct">'+pct+'%</span></div></td></tr>';
    });
    return h+'</tbody></table>';
  }

  var dateStr=fmtLongDate(TODAY);
  var H='';

  /* ── Title ── */
  H+='<div class="doc-title">📊 GDC Project Compliance Dashboard</div>';
  H+='<div class="doc-date">'+dateStr+'</div>';
  H+='<hr class="doc-divider">';

  /* ── Portfolio Health summary pills ── */
  H+='<div class="section">';
  H+='<div class="section-heading">🟢 Portfolio Health</div>';
  H+='<div class="callout callout-blue">Active billable projects with timecard activity in last 90 days, managed by GDC Delivery Managers.</div>';
  H+=pill([
    [N,'Total Active Projects'],
    [pastEnd.length,'Past End Date'],
    [endingOct.length,'Ending by Oct 2026'],
    [redStatus.length,'Red Status'],
    [atRisk.length,'At Risk']
  ]);
  H+='</div>';

  /* ── Immediate Actions ── */
  H+='<div class="section">';
  H+='<div class="section-heading">⚠️ Immediate Actions</div>';
  H+=pill([
    [noStatus.length,'No Status Updated'],
    [missingRpt.length,'Missing Status Reports'],
    [missingCSAT.length,'Missing CSAT']
  ]);
  H+='</div>';

  /* ── Financial Risks ── */
  H+='<div class="section">';
  H+='<div class="section-heading">💰 Financial Risks</div>';
  H+=pill([
    [lowMargin.length,'Low Margin (<50%)'],
    [overBudget.length,'Over Billed'],
    [zeroHours.length,'Zero Planned Hours']
  ]);
  H+='</div>';

  H+='<hr class="doc-divider">';

  /* ── Portfolio Summary table ── */
  H+='<div class="section">';
  H+='<div class="section-heading">🔢 Portfolio Summary</div>';
  H+='<div class="callout callout-green">Compliance metrics are calculated against '+N+' total active projects. Green = all clear, Amber = needs attention, Red = action required.</div>';
  H+='<table class="summary-table"><thead><tr><th class="col-num">#</th><th>Observation</th><th class="col-count">Count</th><th>Comment</th></tr></thead><tbody>';
  H+=sumRow(1,'Total Active Projects',N,'green','Baseline — 100%');
  H+=sumRow(2,'Projects with No Status',noStatus.length,countClass(noStatus.length,3),noStatus.length>0?'Action required — update project status':'All projects have status set');
  H+=sumRow(3,'Missing Status Reports (>14 days)',missingRpt.length,countClass(missingRpt.length,3),missingRpt.length>0?'Status report overdue — follow up with DM':'All reports filed on time');
  H+=sumRow(4,'Projects in Red Status',redStatus.length,countClass(redStatus.length,2),redStatus.length>0?'Needs immediate attention':'No red projects');
  H+=sumRow(5,'Active Projects Past End Date',pastEnd.length,countClass(pastEnd.length,3),pastEnd.length>0?'End date extension or closure needed':'All within end date');
  H+=sumRow(6,'Upcoming End Dates (by Oct 2026)',endingOct.length,'amber','Plan for closure or extension');
  H+=sumRow(7,'Low Margin Projects (<50%)',lowMargin.length,countClass(lowMargin.length,3),lowMargin.length>0?'Finance review needed':'All margins healthy');
  H+=sumRow(8,'Timecard Last Filled >30 Days',timecardLate.length,countClass(timecardLate.length,3),timecardLate.length>0?'Follow up with DM':'Timecards up to date');
  H+=sumRow(9,'Zero Planned Hours',zeroHours.length,countClass(zeroHours.length,2),zeroHours.length>0?'Update project plan in PSA':'All projects have planned hours');
  H+=sumRow(10,'Over Billed (Negative Hours Remaining)',overBudget.length,countClass(overBudget.length,2),overBudget.length>0?'SOW amendment may be needed':'All within budget');
  H+=sumRow(11,'Missing CSAT Survey (>90 days)',missingCSAT.length,countClass(missingCSAT.length,3),missingCSAT.length>0?'Send CSAT survey to customer':'CSAT up to date');
  H+=sumRow(12,'Missing Adoption Events',missingAE.length,countClass(missingAE.length,3),missingAE.length>0?'Create AE record or add exemption reason':'All covered');
  H+=sumRow(13,'At Risk Projects',atRisk.length,countClass(atRisk.length,2),atRisk.length>0?'Review risk register with DM':'No at-risk projects');
  H+='</tbody></table>';
  H+='</div>';

  H+='<hr class="doc-divider">';

  /* ── Detailed sections — each with full project table ── */
  function detailSection(id,icon,title,calloutCls,calloutText,projects,cols){
    return '<div class="section" id="'+id+'">'+
      '<div class="section-heading">'+icon+' '+esc(title)+' <span style="font-size:0.85rem;font-weight:500;color:#64748b;">('+projects.length+' projects)</span></div>'+
      '<div class="callout '+calloutCls+'">'+esc(calloutText)+'</div>'+
      detailTable(projects,cols)+
      '</div>';
  }

  H+=detailSection('sec-nostatus','⚪','Projects with No Status','callout-yellow',
    'These projects have no overall project status set. DM to update immediately.',
    noStatus,['project','account','practice','dm','enddate','report']);

  H+='<hr class="doc-divider">';

  H+=detailSection('sec-missingrpt','📄','Missing Status Reports','callout-yellow',
    'Status report not filed in last 14 days. DM to file update immediately.',
    missingRpt,['project','account','practice','dm','report','status']);

  H+='<hr class="doc-divider">';

  H+=detailSection('sec-red','🔴','Red Status Projects','callout-red',
    'Projects currently flagged as Red. Immediate escalation and remediation plan required.',
    redStatus,['project','account','practice','dm','status','enddate','margin','atrisk']);

  H+='<hr class="doc-divider">';

  H+=detailSection('sec-pastend','📅','Projects Past End Date','callout-red',
    'Active projects whose end date has already passed. Require immediate closure or extension.',
    pastEnd,['project','account','practice','dm','enddate','status','hours','remaining']);

  H+='<hr class="doc-divider">';

  return H;

/* ═══════════════════════════════════════════════════════════
   Fetch + render
   ═══════════════════════════════════════════════════════════ */
function setStatus(msg,color){ var el=document.getElementById('status'); el.textContent=msg; el.style.color=color||'#64748b'; }

function generate(){
  var btn=document.getElementById('gen-btn');
  btn.disabled=true;
  setStatus('Fetching live data from Salesforce...','#0176d3');
  fetch('/api/projects')
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){
      if(data.error) throw new Error(data.error);
      var records=normalise(data.records||[]);
      if(!records.length) throw new Error('0 projects — check SF token at /admin');
      var doc=document.getElementById('canvas-doc');
      doc.innerHTML=buildCanvas(records);
      doc.style.display='block';
      document.getElementById('print-btn').style.display='inline-flex';
      btn.disabled=false;
      setStatus('Canvas ready with '+records.length+' projects. Use Save as PDF to share.','#16a34a');
    })
    .catch(function(e){ btn.disabled=false; setStatus('Error: '+e.message,'#dc2626'); });
}
</script>
